name: byte_bite
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  printing: ^5.13.3
  pdf: ^3.11.1
  image_picker: ^1.2.2
  sqflite: ^2.3.0
  path: ^1.8.3
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  connectivity_plus: ^7.0.0
  crypto: ^3.0.3
  http: ^1.2.2
  path_provider: ^2.1.4
  csv: ^6.0.0
  share_plus: ^11.0.0
  excel: ^4.0.6
  # ── Offline + Cloud Sync ──────────────────────────────────────────────────
  # Used by homepage.dart to detect network status and show sync indicator.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/menu/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/byte_and_bite_logo.png"
  image_path_android: "assets/images/byte_and_bite_logo.png"
  min_sdk_android: 21
